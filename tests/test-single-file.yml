name: Test single file exists
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a single test file
        run: |
          touch /tmp/single-test-file.txt
      - id: action
        uses: .
        with:
          required-files: '/tmp/single-test-file.txt'
      - name: Assert exists output is true for single file
        env:
          ACTUAL: ${{ steps.action.outputs.exists }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
