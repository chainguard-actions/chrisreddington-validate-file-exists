name: Test file does not exist
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          required-files: this-file-does-not-exist-xyz123abc.txt
        continue-on-error: true
      - name: Assert action failed when file does not exist
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.exists }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual exists: $ACTUAL"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when file does not exist"
          elif [ "$ACTUAL" = "false" ]; then
            echo "PASS: action returned exists=false"
          else
            echo "FAIL: expected action to fail or return exists=false, got outcome=$OUTCOME exists=$ACTUAL"
            exit 1
          fi
