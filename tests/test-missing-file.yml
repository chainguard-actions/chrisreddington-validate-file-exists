name: Test missing file - action should fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          required-files: "this-file-does-not-exist.txt"
        continue-on-error: true

      - name: Assert action failed when file is missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when file is missing, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for missing file"
