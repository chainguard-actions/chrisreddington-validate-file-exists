name: Test files missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          required-files: "this-file-does-not-exist.txt"
        continue-on-error: true
      - name: Assert exists output is false or action failed
        env:
          ACTUAL: ${{ steps.action.outputs.exists }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "actual exists: $ACTUAL"
          echo "outcome: $OUTCOME"
          # The action should either output 'false' or fail (exit non-zero)
          if [ "$ACTUAL" = "false" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly indicated file does not exist"
          else
            echo "FAIL: expected exists='false' or outcome='failure', got exists='$ACTUAL' outcome='$OUTCOME'"
            exit 1
          fi
