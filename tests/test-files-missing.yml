name: Test files missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          required-files: '/tmp/this-file-does-not-exist-xyz123.txt'
        continue-on-error: true
      - name: Assert action failed or exists is false
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXISTS: ${{ steps.action.outputs.exists }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exists: $EXISTS"
          # The action should either fail (outcome=failure) or return exists=false
          if [ "$OUTCOME" = "failure" ] || [ "$EXISTS" = "false" ]; then
            echo "PASS: action correctly reported missing file"
          else
            echo "FAIL: expected action to fail or return exists=false, got outcome=$OUTCOME exists=$EXISTS"
            exit 1
          fi
