name: Test files missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          required-files: '/tmp/nonexistent-file-xyz.txt'
        continue-on-error: true
      - name: Assert action did not succeed or exists is false
        env:
          ACTUAL: ${{ steps.action.outputs.exists }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "actual exists: $ACTUAL"
          echo "outcome: $OUTCOME"
          # The action should either fail (outcome=failure) or output exists=false
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when file does not exist"
          elif [ "$ACTUAL" = "false" ]; then
            echo "PASS: action correctly reported exists=false"
          else
            echo "FAIL: expected action to fail or output exists=false, got outcome=$OUTCOME exists=$ACTUAL"
            exit 1
          fi
