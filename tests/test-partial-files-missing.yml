name: Test partial files missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create only one of the required files
        run: |
          touch "$GITHUB_WORKSPACE/existing-file.txt"
      - id: action
        uses: .
        with:
          required-files: "existing-file.txt,missing-file.txt"
        continue-on-error: true
      - name: Assert exists output is false or action failed
        env:
          ACTUAL: ${{ steps.action.outputs.exists }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "actual exists: $ACTUAL"
          echo "outcome: $OUTCOME"
          # The action should either output 'false' or fail when not all files exist
          if [ "$ACTUAL" = "false" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly indicated not all files exist"
          else
            echo "FAIL: expected exists='false' or outcome='failure', got exists='$ACTUAL' outcome='$OUTCOME'"
            exit 1
          fi
